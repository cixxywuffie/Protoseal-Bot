name: Deploy production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing production tag to deploy (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate and resolve tag
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Require main workflow
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployments must be run from main"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag must use the vMAJOR.MINOR.PATCH format"
            exit 1
          fi

      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag commit
        id: tag
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/$VERSION" || {
            echo "::error::Tag $VERSION does not exist"
            exit 1
          }
          DEPLOY_SHA=$(git rev-list -n 1 "$VERSION")
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main || {
            echo "::error::Tag $VERSION does not belong to main"
            exit 1
          }
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

  test:
    name: Maven tests for tag (Java 21)
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tagged version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

  deploy:
    name: Deploy to production
    needs: [resolve, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Validate configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.deploy_sha }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::SSH_PRIVATE_KEY is empty"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::SSH_KNOWN_HOSTS is empty"; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "::error::DEPLOY_HOST is empty"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::DEPLOY_USER is empty"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "::error::DEPLOY_PATH is empty"; exit 1; }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::DEPLOY_SHA is invalid"; exit 1; }

          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null ||
          { echo "::error::SSH_PRIVATE_KEY is not a valid OpenSSH private key"; exit 1; }

          echo "Production deployment configuration is present"

      - name: Pull and restart services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ needs.resolve.outputs.deploy_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -p "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch origin main --tags && git checkout --detach '$DEPLOY_SHA' && docker compose up --build --detach --remove-orphans && docker compose ps"
