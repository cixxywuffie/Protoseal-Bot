name: Deploy production

on:
  workflow_call:
    inputs:
      deploy_sha:
        description: Exact release commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Validate configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::SSH_PRIVATE_KEY is empty"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::SSH_KNOWN_HOSTS is empty"; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "::error::DEPLOY_HOST is empty"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::DEPLOY_USER is empty"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "::error::DEPLOY_PATH is empty"; exit 1; }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::DEPLOY_SHA is invalid"; exit 1; }

          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null ||
          { echo "::error::SSH_PRIVATE_KEY is not a valid OpenSSH private key"; exit 1; }

          echo "Production deployment configuration is present"

      - name: Pull and restart services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -p "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch origin main --tags && git checkout --detach '$DEPLOY_SHA' && docker compose up --build --detach --remove-orphans && docker compose ps"
