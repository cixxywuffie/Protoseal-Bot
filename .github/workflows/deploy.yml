name: Deploy development

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to development
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Validate configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::SSH_PRIVATE_KEY is empty"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "::error::SSH_KNOWN_HOSTS is empty"; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "::error::DEPLOY_HOST is empty"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::DEPLOY_USER is empty"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "::error::DEPLOY_PATH is empty"; exit 1; }

          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null ||
          { echo "::error::SSH_PRIVATE_KEY is not a valid OpenSSH private key"; exit 1; }

          echo "Deployment configuration is present"
      - name: Pull and restart services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -p "${DEPLOY_PORT:-22}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only origin main && docker compose up --build --detach --remove-orphans && docker compose ps"
