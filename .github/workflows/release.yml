name: 🏷️ Create version

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Name of the new release tag (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Require main and a semantic tag name
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production releases must be run from main"
            exit 1
          fi
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag name must use the vMAJOR.MINOR.PATCH format"
            exit 1
          fi

  test:
    name: Maven tests (Java 21)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

  release:
    name: Create tag and GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag does not exist
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            echo "::error::Tag $TAG_NAME already exists"
            exit 1
          fi

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: gh release create "$TAG_NAME" --target "$GITHUB_SHA" --title "$TAG_NAME" --generate-notes
