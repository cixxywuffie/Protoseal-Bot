# Uses the MariaDB Compose service by default. DB_URL can point to an external MariaDB instance.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Use "validate" once schema migrations are introduced and managed separately.
# Common JPA settings are configurable in application.properties.
