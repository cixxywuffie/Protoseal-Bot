# Shared development server. Defaults match compose.yaml.
spring.datasource.url=${DB_URL:jdbc:mariadb://mariadb:3306/protoseal_dev}
spring.datasource.username=${DB_USERNAME:protoseal}
spring.datasource.password=${DB_PASSWORD:protoseal_dev}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
